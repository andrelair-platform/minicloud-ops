[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicloud-ops"
version = "0.1.0"
description = "Operational tooling for the minicloud k3s platform"
requires-python = ">=3.10"

[project.scripts]
minicloud-recovery-check = "recovery_check.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["recovery_check*"]
