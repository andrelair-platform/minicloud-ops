name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run detector test suite (deterministic, no cluster)
        run: |
          set -e
          PYTHONPATH=. python3 tests/test_control_chart.py
          PYTHONPATH=. python3 tests/test_bands.py
